<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="ProtegeWX">
  <defs>
    <linearGradient id="escudo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#005060"/>
      <stop offset="100%" stop-color="#012c33"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8fc9d8"/>
      <stop offset="100%" stop-color="#70b0c0"/>
    </linearGradient>
  </defs>

  <!-- escudo -->
  <path d="M100 12 L172 40 V104 C172 146 140 174 100 188 C60 174 28 146 28 104 V40 Z"
        fill="url(#escudo)" stroke="url(#brilho)" stroke-width="5" stroke-linejoin="round"/>

  <!-- dongle USB estilizado, protegido dentro do escudo -->
  <rect x="76" y="58" width="48" height="66" rx="9" fill="#013a48" stroke="#70b0c0" stroke-width="4"/>
  <rect x="88" y="44" width="24" height="18" rx="4" fill="#70b0c0"/>
  <line x1="93"  y1="44" x2="93"  y2="34" stroke="#70b0c0" stroke-width="5" stroke-linecap="round"/>
  <line x1="107" y1="44" x2="107" y2="34" stroke="#70b0c0" stroke-width="5" stroke-linecap="round"/>

  <!-- contatos do chip -->
  <g fill="#8fc9d8">
    <rect x="86"  y="76" width="28" height="5" rx="2.5"/>
    <rect x="86"  y="88" width="28" height="5" rx="2.5"/>
    <rect x="86"  y="100" width="18" height="5" rx="2.5"/>
  </g>

  <!-- raio: a parte "guerreira" -->
  <path d="M106 128 L88 156 L99 156 L92 178 L114 148 L102 148 Z"
        fill="#4dc247" stroke="#012c33" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
